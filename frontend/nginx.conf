# Sirve la SPA y hace de gateway: el navegador solo habla con este origen (/api/...),
# así que no hace falta CORS. Cada /api/<servicio> se reenvía al microservicio sin el prefijo /api.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx ya reenvía todos los headers del cliente; se dejan explícitos los que el contrato exige.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Idempotency-Key $http_idempotency_key;

  # Las respuestas del backend (incluido Idempotent-Replayed) pasan tal cual. Mismo origen → el
  # navegador ya puede leerlo; se expone también por si el gateway se consume desde otro origen.
  add_header Access-Control-Expose-Headers "Idempotent-Replayed" always;

  location /api/auth/ {
    proxy_pass http://auth-service:3001/auth/;
  }

  location /api/transfers {
    proxy_pass http://payments-service:3002/transfers;
  }

  location /api/accounts {
    proxy_pass http://payments-service:3002/accounts;
  }

  location /api/payment-links {
    proxy_pass http://payments-service:3002/payment-links;
  }

  location /api/audit/ {
    proxy_pass http://audit-service:3003/audit/;
  }

  # SPA: cualquier ruta que no sea un archivo (/, /login, /transfers/:id) devuelve index.html.
  location / {
    try_files $uri /index.html;
  }
}
